```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une surprise ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle, #3b0018, #080008);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: white;
    }

    .container {
        text-align: center;
        z-index: 2;
    }

    .heart {
        font-size: 130px;
        cursor: pointer;
        animation: beat 1s infinite;
        filter: drop-shadow(0 0 25px #ff1744);
    }

    @keyframes beat {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.18);
        }
    }

    h1 {
        font-size: 28px;
        margin-top: 20px;
    }

    #message {
        display: none;
        font-size: 22px;
        line-height: 1.6;
        margin-top: 20px;
        animation: appear 2s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .floating-heart {
        position: absolute;
        bottom: -50px;
        animation: float 6s linear forwards;
        opacity: 0.8;
    }

    @keyframes float {
        from {
            transform: translateY(0);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #ff1744;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="container">

    <div class="heart" onclick="showSurprise()">❤️</div>

    <h1>Appuie sur le cœur 💗</h1>

    <div id="message">
        ✨ Surprise ! ✨<br>
        Tu es une personne vraiment spéciale ❤️<br>
        J'espère que cette petite surprise<br>
        te fera sourire 🥰
    </div>

    <button onclick="showSurprise()">Ouvrir la surprise 💌</button>

</div>

<script>
function showSurprise() {
    document.getElementById("message").style.display = "block";

    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");

        heart.className = "floating-heart";
        heart.innerHTML = ["❤️", "💕", "💖", "💗", "💘"][Math.floor(Math.random() * 5)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 30) + "px";
        heart.style.animationDuration = (4 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 8000);
    }
}
</script>

</body>
</html>
